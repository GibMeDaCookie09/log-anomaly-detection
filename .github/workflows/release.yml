name: Release

# Publishing is driven by tags, not by branches: an image exists because someone
# cut a version, and the tag is the thing that ties image to source.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # A tag push does not match ci.yml's branch filter, so without this a broken
  # commit could be tagged and published having never run the test suite.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: build and push to ghcr.io
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute build metadata
        id: vars
        run: |
          # ghcr rejects uppercase repository paths; GitHub usernames allow them.
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          # Derived from github.sha (not git rev-parse) so it is guaranteed to
          # match the tag docker/metadata-action generates.
          echo "sha_tag=sha-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided by Actions; no PAT to create, rotate, or leak.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags per image, deliberately:
      #   v1.4.0     - what a human asks for
      #   sha-a1b2c3 - what a deployment records, so a running container can be
      #                traced to one commit even after tags get moved
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.vars.outputs.version }}
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Traceability is a claim until something checks it. Pull the published
      # image by its SHA tag and confirm the running container reports the commit
      # it was built from.
      - name: Verify published image reports its provenance
        run: |
          IMAGE="${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha_tag }}"
          docker pull "$IMAGE"
          docker run -d --name verify -p 8000:8000 "$IMAGE"
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8000/health -o health.json; then break; fi
            sleep 1
          done
          cat health.json
          # jq, not python: this job never runs setup-python, and `python`
          # (as opposed to python3) is not something to rely on being on PATH.
          REPORTED_SHA=$(jq -r '.build.sha' health.json)
          REPORTED_VER=$(jq -r '.build.version' health.json)
          docker rm -f verify
          if [ "$REPORTED_SHA" != "${{ github.sha }}" ]; then
            echo "::error::image reports sha $REPORTED_SHA, expected ${{ github.sha }}"
            exit 1
          fi
          if [ "$REPORTED_VER" != "${{ steps.vars.outputs.version }}" ]; then
            echo "::error::image reports version $REPORTED_VER, expected ${{ steps.vars.outputs.version }}"
            exit 1
          fi
          echo "verified: $IMAGE reports $REPORTED_VER / $REPORTED_SHA"

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
