name: Deploy

on:
  push:
    branches: [main]
  # Manual redeploy or roll-forward/back to a specific published tag. The single
  # most useful thing to have already built when something is broken at 2am.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Published tag to deploy (e.g. v0.1.0 or sha-a1b2c3d). Defaults to this commit."
        required: false
        type: string

# Deploys must not overlap - two deploy.sh runs against one host would race over
# the same container name. cancel-in-progress is deliberately false: cancelling a
# deploy midway is how you end up with nothing running.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: build and push
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image_ref }}
      # Empty when deploying a pre-existing tag: that image reports the SHA it
      # was built from, not this run's, and deploy.sh skips the check when the
      # expected value is empty.
      sha: ${{ steps.vars.outputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference
        id: vars
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          if [ -n "${{ inputs.image_tag }}" ]; then
            # Manual dispatch: deploy an already-published tag, do not rebuild.
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "image_ref=${IMAGE}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "expected_sha=" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "image_ref=${IMAGE}:sha-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
            echo "expected_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.vars.outputs.rebuild == 'true'

      - name: Log in to ghcr.io
        if: steps.vars.outputs.rebuild == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.vars.outputs.rebuild == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image_ref }}
            ${{ steps.vars.outputs.image }}:main
          build-args: |
            BUILD_VERSION=main
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: roll the container
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Trust-on-first-use. The instance is rebuilt by `terraform apply`, so
          # its host key changes and a pinned fingerprint would break every
          # rebuild. The exposure is a MITM on the first connection after a
          # rebuild; pinning the key in a secret is the stricter alternative if
          # the instance becomes long-lived.
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # The whole deploy/ directory, not just deploy.sh: the self-monitoring
      # runner and its systemd units ship with the code too.
      - name: Copy deploy and monitoring scripts
        run: |
          TARGET="${{ vars.DEPLOY_USER || 'ec2-user' }}@${{ secrets.DEPLOY_HOST }}"
          ssh -i ~/.ssh/deploy_key "$TARGET" "rm -rf /tmp/loganomaly-deploy && mkdir -p /tmp/loganomaly-deploy"
          scp -i ~/.ssh/deploy_key deploy/* "$TARGET:/tmp/loganomaly-deploy/"
          ssh -i ~/.ssh/deploy_key "$TARGET" "chmod +x /tmp/loganomaly-deploy/*.sh"

      # GHCR packages are private by default, so the host gets a 401 on pull
      # unless it is authenticated. The run-scoped GITHUB_TOKEN is used rather
      # than a PAT: it expires when the job ends, so nothing long-lived is left
      # sitting in the instance's docker config. (Making the package public is
      # the other valid answer, and removes this step entirely.)
      - name: Authenticate the host to ghcr.io
        run: |
          ssh -i ~/.ssh/deploy_key             "${{ vars.DEPLOY_USER || 'ec2-user' }}@${{ secrets.DEPLOY_HOST }}"             "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"             <<< "${{ secrets.GITHUB_TOKEN }}"

      # deploy.sh owns the rolling, the health gate and the rollback. The workflow
      # only decides what to tell the operator, based on which failure happened.
      - name: Deploy and health-gate
        id: deploy
        run: |
          set +e
          ssh -i ~/.ssh/deploy_key \
            "${{ vars.DEPLOY_USER || 'ec2-user' }}@${{ secrets.DEPLOY_HOST }}" \
            "bash /tmp/deploy.sh '${{ needs.publish.outputs.image }}' '${{ needs.publish.outputs.sha }}'"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Interpret result
        run: |
          RC="${{ steps.deploy.outputs.rc }}"
          IMAGE="${{ needs.publish.outputs.image }}"
          case "$RC" in
            0)
              echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
              echo "\`$IMAGE\` is live and healthy." >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              echo "### Deploy failed - rolled back" >> "$GITHUB_STEP_SUMMARY"
              echo "\`$IMAGE\` did not pass the health gate. The previous image was restored and is serving traffic." >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Deploy failed; automatic rollback succeeded. Service is up on the previous image."
              exit 1
              ;;
            2)
              echo "### CRITICAL - service is down" >> "$GITHUB_STEP_SUMMARY"
              echo "\`$IMAGE\` failed AND the rollback failed. Manual intervention required." >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Deploy and rollback both failed. THE SERVICE IS DOWN."
              exit 1
              ;;
            *)
              echo "::error::Deploy script exited $RC (usage or environment error)."
              exit 1
              ;;
          esac

      # Installed after the roll, so a deploy that rolled back does not also
      # leave a timer pointed at an image that never worked.
      - name: Install the self-monitoring timer
        if: steps.deploy.outputs.rc == '0'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ vars.DEPLOY_USER || 'ec2-user' }}@${{ secrets.DEPLOY_HOST }}" "bash /tmp/loganomaly-deploy/install_monitoring.sh /tmp/loganomaly-deploy"

      - name: Revoke the host's registry credentials
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key             "${{ vars.DEPLOY_USER || 'ec2-user' }}@${{ secrets.DEPLOY_HOST }}"             "docker logout ghcr.io" || true

      # Independent confirmation from outside the host. deploy.sh checks
      # localhost; this checks that the security group, the port mapping and the
      # public address all actually work - which localhost cannot tell you.
      - name: Verify from outside the instance
        if: steps.deploy.outputs.rc == '0'
        run: |
          URL="http://${{ secrets.DEPLOY_HOST }}:${{ vars.API_PORT || '8000' }}/health"
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 "$URL" -o health.json; then
              cat health.json
              exit 0
            fi
            sleep 3
          done
          echo "::warning::Service is healthy on the host but not reachable at $URL - check the security group's api_ingress_cidrs."
