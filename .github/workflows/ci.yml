name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Callable from release.yml so a tag cannot publish an image that never
  # passed CI. Tag pushes do not match the branch filter above.
  workflow_call:
  # Re-run CI on demand without inventing a commit to trigger it - useful when a
  # job failed for an external reason (a registry timeout, a runner hiccup)
  # rather than because the code changed.
  workflow_dispatch:

# A new push to the same branch makes the in-flight run obsolete. Cancelling it
# frees a runner and keeps queue times down.
#
# github.workflow is in the key because this workflow is also called by
# release.yml and deploy.yml. In a called workflow it resolves to the *caller's*
# name, so a push to main - which triggers this workflow directly and also
# triggers Deploy, which calls it - produces two runs in two different groups
# instead of two runs in one group that cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every failing version in one run rather than stopping at the first.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Restores ~/.cache/pip keyed on the hash of the requirements files.
          # scikit-learn/scipy/pandas are large wheels; downloading them on every
          # run is the single biggest cost in this job. See README for measured
          # before/after.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # requirements-dev, not requirements: the API tests drive the app through
      # fastapi.testclient, which needs httpx - a test dependency, not a runtime
      # one, and deliberately kept out of the shipped image.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check --diff .

  deploy-script:
    name: deploy script (shellcheck + rollback tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck deploy/*.sh

      # The rollback path is the least exercised and most important branch in the
      # project - in normal operation it never runs. These stub out docker and
      # curl so every failure mode is asserted on each PR rather than discovered
      # during an outage.
      - name: rollback behaviour
        run: bash deploy/test_deploy.sh

  terraform:
    name: terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: fmt
        run: terraform -chdir=infra fmt -check -recursive -diff

      # -backend=false: validate needs the provider schemas but must not touch
      # remote state or require credentials. The lock file is committed with
      # hashes for linux as well as the authoring platform, so this init is
      # reproducible rather than re-resolving versions.
      - name: init
        run: terraform -chdir=infra init -backend=false -input=false

      - name: validate
        run: terraform -chdir=infra validate

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: loganomaly:ci
          # Layer cache in GitHub Actions cache storage. The pip install layer
          # is the expensive one and only rebuilds when requirements.txt changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves it compiles. Starting it proves it runs - which is the
      # thing that actually breaks. The same /health probe gates deploys later.
      - name: Smoke test /health
        run: |
          docker run -d --name smoke -p 8000:8000 loganomaly:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then
              echo "healthy after ${i}s"
              cat /tmp/health.json
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "::error::container did not become healthy within 60s"
          docker logs smoke
          docker rm -f smoke
          exit 1

  # Single required status check for branch protection: stays green only if all
  # three jobs above did. Without this you have to update branch protection
  # every time the matrix changes.
  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [test, lint, deploy-script, terraform, docker]
    if: always()
    steps:
      - name: Fail if any upstream job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed."
