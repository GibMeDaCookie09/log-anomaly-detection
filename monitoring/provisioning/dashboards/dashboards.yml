apiVersion: 1

providers:
  - name: loganomaly
    orgId: 1
    folder: ""
    type: file
    # Provisioned dashboards are read-only in the UI on purpose: the file in the
    # repo is the source of truth, so a dashboard cannot be edited into a state
    # nobody can reproduce.
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
