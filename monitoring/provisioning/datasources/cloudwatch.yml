apiVersion: 1

datasources:
  - name: CloudWatch
    type: cloudwatch
    uid: loganomaly-cloudwatch
    isDefault: true
    jsonData:
      # "default" walks the AWS SDK credential chain, which on this host ends at
      # the instance role. No access keys are stored anywhere - not in this file,
      # not in the Grafana database, not in an env var.
      authType: default
      defaultRegion: ${AWS_REGION}
      customMetricsNamespaces: loganomaly/api
